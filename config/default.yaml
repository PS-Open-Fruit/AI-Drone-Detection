# === Camera Station ===
camera:
  latitude: 14.305029     # degrees North
  longitude: 101.173010   # degrees East
  altitude: 37.2          # meters above MSL
  station_id: "STATION_ALPHA"

# === Module 1: Detection ===
detection:
  # Image processing (morphological) - verified against TESA archive
  threshold_min: 60
  threshold_max: 255
  dilation_kernel_size: 50
  dilation_iterations: 1
  erosion_kernel_size: 9
  erosion_iterations: 1
  close_kernel_size: 5
  close_iterations: 1
  min_contour_area: 0
  max_area_ratio: 0.01
  dim_factor: 0.1

  # Clutter & false-alarm suppression
  suppress_timestamp: true
  timestamp_y_max: 120
  timestamp_x_ratio: 0.60
  suppress_foliage: true
  foliage_y_ratio: 0.88
  roi_padding: 25

  # YOLO (runs on the RAW frame; see defense/detection/drone_detector.py)
  yolo_model_path: "models/yolo11n-obb.pt"
  confidence: 0.40          # min YOLO confidence for a box confirmed by a morphological candidate
  standalone_conf: none     # unconfirmed YOLO boxes kept only above this (none = never; static scene
                            # objects score 0.5-0.7 on every frame of this camera)
  yolo_mode: "crops"        # crops: native-resolution crops around candidates (fast on CPU)
                            # frame: whole frame at yolo_imgsz (finds drones morphology misses)
  crop_size: 320
  yolo_imgsz: 1280
  confirm_margin: 30        # px around a candidate within which a YOLO centre counts as confirming
  tight_boxes: true         # unconfirmed candidates use the dark-pixel extent, not the dilated blob
  device: "cpu"             # "cpu", "cuda", "0", etc.

  # SAHI
  slice_size: 640
  overlap_ratio: 0.25
  nms_threshold: 0.60

# === Module 2: Localization ===
localization:
  models_dir: "models/"         # expects geo_localizer.bin (scripts/train_gbdt.py)
  model_formulation: "polar"    # polar: GBDTs on bearing / log distance / height
                                # hybrid: linear bearing + elevation, GBDT distance
  # GBDT hyperparameters (for training)
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 5
  min_samples_split: 5
  min_samples_leaf: 2
  subsample: 0.9

  # Fusion
  fusion_mode: "adaptive"       # adaptive | filter | soft | hard | yolo | seg
  soft_threshold: 0.25
  iou_weight: 0.60
  shape_weight: 0.30
  motion_weight: 0.10
  area_ratio_min: 0.00005
  area_ratio_max: 0.01
  aspect_ratio_min: 0.4
  aspect_ratio_max: 3.0

# === Module 3: Tracking ===
tracking:
  min_track_confidence: 3       # frames before a track is confirmed
  track_memory: 30              # frames to keep a lost track alive
  max_distance_threshold: 100   # pixels for association gating
  require_yolo_for_new_tracks: true  # morphology-only candidates may extend tracks but not start them

# === Telemetry ===
telemetry:
  api_endpoint: ""              # leave empty to disable API dispatch
  enabled: false

# === Video Output ===
output:
  codec: "mp4v"
  max_file_size_mb: 200
