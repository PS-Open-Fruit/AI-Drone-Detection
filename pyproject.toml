[project]
name = "defense"
version = "1.0.0"
description = "AI-Based Drone Detection, Localization & Tracking System"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.1.0",
    "sahi>=0.11.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pandas>=2.3.3",
    # Already required by ultralytics; listed so [tool.uv.sources] can pick the CPU build on ARM
    "torch>=1.8.0",
    "torchvision>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# NCNN runtime for the exported YOLO model (fastest CPU backend on Raspberry Pi / ARM)
edge = [
    "ncnn>=1.0.20260526",
]

[tool.uv.sources]
# On ARM boards (Raspberry Pi) the default PyPI torch is the CUDA build (~2.5 GB of unusable NVIDIA libraries).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
defense-detect = "scripts.detect_images:main"
defense-localize = "scripts.localize_drones:main"
defense-track = "scripts.track_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
